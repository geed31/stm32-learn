<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>STM32 Learn</title>
  <script>
    // SPA redirect: GitHub Pages serves 404.html for unknown paths.
    // Convert the path into a query param so index.html can restore it.
    var path = window.location.pathname.slice('/stm32-learn'.length)
    window.location.replace(
      '/stm32-learn/?_redirect=' + encodeURIComponent(path)
    )
  </script>
</head>
<body>
  <p>Redirecting…</p>
</body>
</html>
